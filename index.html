<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizify — Online Quiz Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RESET ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}

/* ── DESIGN TOKENS ─────────────────────────────────── */
:root{
  --indigo:#6366f1; --indigo-d:#4f46e5; --indigo-l:#e0e7ff; --indigo-xl:#eef2ff;
  --emerald:#10b981; --rose:#ef4444; --amber:#f59e0b; --sky:#3b82f6;
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9;
  --border:#e2e8f0; --border2:#cbd5e1;
  --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --sidebar:#18124a; --sidebar2:#221a6b;
  --rad:10px; --rad-lg:16px; --rad-xl:20px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}
.dark{
  --bg:#0d1117; --surface:#161b22; --surface2:#21262d;
  --border:#30363d; --border2:#484f58;
  --text:#e6edf3; --text2:#8b949e; --text3:#484f58;
  --sidebar:#0d1117; --sidebar2:#161b22;
  --indigo-l:#1e1b4b; --indigo-xl:#1e1b4b;
  --shadow:0 1px 3px rgba(0,0,0,.3); --shadow-md:0 4px 12px rgba(0,0,0,.4);
}

/* ── LAYOUT ─────────────────────────────────────────── */
#app{display:flex;min-height:100vh}
.sidebar{
  width:240px;background:var(--sidebar);flex-shrink:0;
  display:flex;flex-direction:column;position:fixed;
  top:0;left:0;height:100vh;z-index:200;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sb-logo{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo .wordmark{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.5px}
.sb-logo .wordmark em{font-style:normal;color:#818cf8}
.sb-logo .tagline{font-size:11px;color:rgba(255,255,255,.3);margin-top:3px}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-section{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.22);padding:14px 10px 5px}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;
  border:none;background:none;color:rgba(199,210,254,.8);border-radius:8px;
  font-size:13.5px;cursor:pointer;transition:all .15s;text-align:left;
}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.active{background:#4f46e5;color:#fff}
.nav-btn .ico{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav-btn.active .ico,.nav-btn:hover .ico{opacity:1}
.sb-foot{padding:10px 8px;border-top:1px solid rgba(255,255,255,.07)}
.sb-user{display:flex;align-items:center;gap:9px;padding:9px 10px;margin-bottom:4px}
.sb-user .name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .role{font-size:11px;color:rgba(255,255,255,.35)}

.main-wrap{flex:1;margin-left:240px;display:flex;flex-direction:column;min-height:100vh}
.topbar{
  height:58px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 24px;gap:12px;
  position:sticky;top:0;z-index:100;
}
.topbar-title{font-size:15.5px;font-weight:600;flex:1;color:var(--text)}
.page-body{flex:1;padding:26px}

/* ── AVATAR ─────────────────────────────────────────── */
.av{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
  background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;
}
.av-lg{width:72px;height:72px;font-size:24px;border-radius:50%}

/* ── CARDS ──────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-lg);padding:22px}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:16px}

/* ── QUIZ CARDS ─────────────────────────────────────── */
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(278px,1fr));gap:18px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-lg);overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}
.qcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.qcard-banner{height:136px;display:flex;align-items:center;justify-content:center;font-size:50px;position:relative}
.qcard-banner .cat-chip{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.35);color:#fff;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;backdrop-filter:blur(4px)}
.qcard-body{padding:14px 16px 16px}
.qcard-body h3{font-size:14.5px;font-weight:600;margin-bottom:5px;color:var(--text)}
.qcard-body p{font-size:12.5px;color:var(--text2);line-height:1.55;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qcard-meta{display:flex;gap:10px;flex-wrap:wrap}
.qcard-meta span{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text3)}
.qcard-meta svg{width:11px;height:11px}

/* ── STAT CARDS ─────────────────────────────────────── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-lg);padding:18px 20px}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.stat-icon svg{width:19px;height:19px}
.stat-val{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.stat-lbl{font-size:12.5px;color:var(--text2);margin-top:5px}

/* ── BUTTONS ────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:500;border:none;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:var(--indigo);color:#fff}
.btn-primary:hover{background:var(--indigo-d);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-text{background:transparent;color:var(--text2);border:none}
.btn-text:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:#fef2f2;color:var(--rose);border:1px solid #fecaca}
.btn-danger:hover{background:#fee2e2}
.btn-success{background:#ecfdf5;color:var(--emerald);border:1px solid #a7f3d0}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-sm svg{width:13px;height:13px}
.btn-icon{padding:7px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed;pointer-events:none}

/* ── FORMS ──────────────────────────────────────────── */
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}
.inp{width:100%;padding:9px 12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;font-size:13.5px;color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--indigo);background:var(--surface);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.inp.err{border-color:var(--rose)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
.field .err-msg{font-size:11.5px;color:var(--rose);margin-top:5px}

/* ── BADGES ─────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.2px}
.badge-indigo{background:var(--indigo-l);color:var(--indigo-d)}
.badge-green{background:#d1fae5;color:#065f46}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-rose{background:#fee2e2;color:#991b1b}
.badge-gray{background:var(--surface2);color:var(--text2)}
.dark .badge-green{background:#064e3b;color:#6ee7b7}
.dark .badge-amber{background:#78350f;color:#fcd34d}
.dark .badge-rose{background:#7f1d1d;color:#fca5a5}

/* ── PAGE HEADER ────────────────────────────────────── */
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.page-hdr-l h1{font-size:21px;font-weight:700;color:var(--text)}
.page-hdr-l p{font-size:13px;color:var(--text2);margin-top:3px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-hdr h2{font-size:15px;font-weight:600;color:var(--text)}

/* ── DIVIDER ────────────────────────────────────────── */
.divider{height:1px;background:var(--border);margin:20px 0}

/* ── TABLES ─────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;border-radius:var(--rad)}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 14px;text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);border-bottom:1px solid var(--border)}
tbody td{padding:13px 14px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}

/* ── PROGRESS BAR ───────────────────────────────────── */
.pbar{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .4s ease}

/* ── TABS ───────────────────────────────────────────── */
.tabs{display:flex;border-bottom:1.5px solid var(--border);margin-bottom:20px;gap:0}
.tab-btn{padding:10px 18px;font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--indigo);border-bottom-color:var(--indigo)}

/* ── TOGGLE ─────────────────────────────────────────── */
.toggle{width:40px;height:21px;background:var(--border);border-radius:11px;position:relative;cursor:pointer;border:none;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--indigo)}
.toggle::after{content:'';width:15px;height:15px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(19px)}

/* ── TOAST ──────────────────────────────────────────── */
.toast-area{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;padding:11px 16px;
  border-radius:10px;font-size:13px;font-weight:500;
  box-shadow:var(--shadow-lg);pointer-events:auto;
  animation:toastIn .3s ease both;max-width:320px;
}
.toast-ok{background:#0f766e;color:#fff}
.toast-er{background:#be123c;color:#fff}
.toast-wa{background:#b45309;color:#fff}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(110%);opacity:0}}

/* ── EMPTY STATE ────────────────────────────────────── */
.empty{text-align:center;padding:56px 20px;color:var(--text2)}
.empty .empty-ico{font-size:40px;margin-bottom:14px;opacity:.6}
.empty h3{font-size:16px;font-weight:600;margin-bottom:7px;color:var(--text)}
.empty p{font-size:13px;line-height:1.6}

/* ── SPINNER ────────────────────────────────────────── */
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rotate .7s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}

/* ── OVERLAY / MODAL ────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--rad-xl);width:100%;max-width:580px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-hdr{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hdr h3{font-size:16px;font-weight:600}
.modal-body{padding:22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* ── AUTH ───────────────────────────────────────────── */
.auth-page{min-height:100vh;background:linear-gradient(145deg,#1e1b4b 0%,#312e81 55%,#4338ca 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:var(--surface);border-radius:var(--rad-xl);padding:38px;width:100%;max-width:408px;box-shadow:var(--shadow-lg)}
.auth-head{text-align:center;margin-bottom:26px}
.auth-head .logo{font-size:26px;font-weight:800;color:var(--text)}
.auth-head .logo em{font-style:normal;color:var(--indigo)}
.auth-head p{font-size:13px;color:var(--text2);margin-top:6px}
.alert-box{padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px}
.alert-err{background:#fef2f2;border:1px solid #fecaca;color:#be123c}

/* ── LANDING ────────────────────────────────────────── */
.land-page{background:var(--bg)}
.land-nav{
  background:rgba(17,13,63,.92);height:62px;display:flex;align-items:center;
  justify-content:space-between;padding:0 40px;position:sticky;top:0;z-index:100;
  backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06);
}
.land-nav-logo{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.3px}
.land-nav-logo em{font-style:normal;color:#818cf8}
.land-nav-links{display:flex;align-items:center;gap:8px}
.land-nav-links .lnk{color:rgba(199,210,254,.8);background:none;border:none;cursor:pointer;font-size:13.5px;padding:7px 12px;border-radius:7px;transition:color .15s}
.land-nav-links .lnk:hover{color:#fff;background:rgba(255,255,255,.07)}

.hero{background:linear-gradient(150deg,#18124a 0%,#2d2880 60%,#3730a3 100%);color:#fff;padding:0px 40px;min-height:calc(100vh - 62px);;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236366f1' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.hero-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(99,102,241,.2);border:1px solid rgba(165,180,252,.25);border-radius:30px;padding:5px 14px;margin-bottom:22px;font-size:12.5px;color:#a5b4fc}
.hero h1{font-size:50px;font-weight:800;letter-spacing:-1.5px;margin-bottom:16px;line-height:1.1}
.hero h1 span{color:#a5b4fc}
.hero .sub{font-size:17px;color:rgba(199,210,254,.85);max-width:540px;margin:0 auto 32px;line-height:1.65}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hbtn{padding:13px 28px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .18s}
.hbtn-fill{background:var(--indigo);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.4)}
.hbtn-fill:hover{background:var(--indigo-d);transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.5)}
.hbtn-outline{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25)}
.hbtn-outline:hover{background:rgba(255,255,255,.15)}
.hero-nums{display:flex;gap:44px;justify-content:center;margin-top:52px;flex-wrap:wrap}
.hero-num-val{font-size:30px;font-weight:800}
.hero-num-lbl{font-size:12px;color:rgba(199,210,254,.7);margin-top:2px}

.features-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;padding:58px 40px;background:var(--bg)}
.feat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-lg);padding:26px 22px;text-align:center}
.feat-ico{width:52px;height:52px;border-radius:14px;background:var(--indigo-l);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.feat-ico svg{width:22px;height:22px;color:var(--indigo)}
.feat-card h3{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--text)}
.feat-card p{font-size:13px;color:var(--text2);line-height:1.6}

.featured-section{padding:40px;background:var(--surface2)}
.featured-section .inner{max-width:1100px;margin:0 auto}
.featured-section .row-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.featured-section h2{font-size:22px;font-weight:700;color:var(--text)}

.land-cta-band{background:linear-gradient(135deg,#1e1b4b,#4f46e5);padding:60px 40px;text-align:center;color:#fff}
.land-cta-band h2{font-size:30px;font-weight:700;margin-bottom:14px}
.land-cta-band p{font-size:15px;color:#c7d2fe;margin-bottom:28px}
.land-footer{background:#090d1a;color:rgba(255,255,255,.3);padding:22px 40px;text-align:center;font-size:12.5px}

/* ── QUIZ TAKING ────────────────────────────────────── */
.quiz-page{min-height:100vh;background:var(--bg);padding:22px}
.qprog-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.qprog-fill{height:100%;background:linear-gradient(90deg,var(--indigo),#818cf8);border-radius:3px;transition:width .35s ease}
.opt-item{
  display:flex;align-items:center;gap:12px;padding:13px 16px;
  border:1.5px solid var(--border);border-radius:10px;cursor:pointer;
  transition:all .15s;margin-bottom:10px;background:var(--surface);
}
.opt-item:hover{border-color:var(--indigo);background:var(--indigo-xl)}
.opt-item.selected{border-color:var(--indigo);background:var(--indigo-l)}
.opt-item.correct{border-color:var(--emerald);background:#ecfdf5}
.opt-item.wrong{border-color:var(--rose);background:#fef2f2}
.dark .opt-item.correct{background:#064e3b22}
.dark .opt-item.wrong{background:#7f1d1d22}
.opt-letter{
  width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;flex-shrink:0;transition:all .15s;
}
.opt-item:hover .opt-letter,.opt-item.selected .opt-letter{border-color:var(--indigo);background:var(--indigo);color:#fff}
.opt-item.correct .opt-letter{border-color:var(--emerald);background:var(--emerald);color:#fff}
.opt-item.wrong .opt-letter{border-color:var(--rose);background:var(--rose);color:#fff}
.q-dot{
  width:27px;height:27px;border-radius:50%;border:1.5px solid var(--border);
  background:transparent;color:var(--text2);font-size:11px;font-weight:600;
  cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;
}
.q-dot.cur{border-color:var(--indigo);background:var(--indigo);color:#fff}
.q-dot.done{border-color:var(--emerald);background:var(--emerald);color:#fff}

/* ── RESULT ─────────────────────────────────────────── */
.score-ring{
  width:140px;height:140px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 auto 18px;border:5px solid var(--indigo);
  background:var(--indigo-l);
}
.score-ring .val{font-size:34px;font-weight:700;color:var(--indigo-d);line-height:1}
.score-ring .of{font-size:13px;color:var(--text2);margin-top:4px}
.score-ring.pass{border-color:var(--emerald);background:#ecfdf5}
.score-ring.fail{border-color:var(--rose);background:#fef2f2}
.score-ring.pass .val{color:var(--emerald)}
.score-ring.fail .val{color:var(--rose)}

/* ── LEADERBOARD PODIUM ─────────────────────────────── */

function toast(msg, type='ok'){
  const area = document.getElementById('toastArea');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const icons = {ok:I.check,er:I.x,wa:I.info};
  el.innerHTML = (icons[type]||'') + `<span>${msg}</span>`;
  area.appendChild(el);
  setTimeout(()=>{ el.style.animation='toastOut .3s ease forwards'; setTimeout(()=>el.remove(),300); }, 3000);
}

function go(page, ctx=null){
  S.page = page;
  if(page==='take_quiz' && ctx){ S.quizCtx = ctx; initQT(ctx); }
  if(page==='edit_quiz' && ctx){ S.editCtx = ctx; S.cq = null; }
  if(page==='create_quiz'){ S.editCtx = null; S.cq = null; }
  // stop any running timer when leaving quiz
  if(page!=='take_quiz' && S.qt.timer){ clearInterval(S.qt.timer); S.qt.timer=null; }
  document.getElementById('mobBackdrop').classList.remove('open');
  const sb = document.querySelector('.sidebar');
  if(sb) sb.classList.remove('open');
  window.scrollTo(0,0);
  draw();
}

function toggleDark(){
  S.dark = !S.dark;
  document.documentElement.classList.toggle('dark', S.dark);
  draw();
}
function closeSidebar(){
  document.querySelector('.sidebar')?.classList.remove('open');
  document.getElementById('mobBackdrop').classList.remove('open');
}
function openSidebar(){
  document.querySelector('.sidebar')?.classList.add('open');
  document.getElementById('mobBackdrop').classList.add('open');
}

  const u = S.users.find(x=>x.email===email);
  if(!u || !checkPw(pw,u.password)) return false;
  S.me = u; go('dashboard'); toast('Welcome back, '+u.username+'!'); return true;
}
function doLogout(){ S.me=null; go('landing'); toast('Signed out'); }
function doRegister(username,email,pw){
  if(S.users.find(u=>u.email===email)) return false;
  const u = {id:uid(),username,email,password:hashPw(pw),role:'user',createdAt:new Date().toISOString(),av:username.slice(0,2).toUpperCase()};
  S.users.push(u); S.me=u; go('dashboard'); toast('Welcome, '+username+'!'); return true;
}

  S.quizzes = S.quizzes.filter(q=>q.id!==id);
  S.attempts = S.attempts.filter(a=>a.quizId!==id);
  toast('Quiz deleted'); draw();
}
function delUser(id){
  if(id===S.me?.id){toast('Cannot delete yourself','wa');return;}
  S.users = S.users.filter(u=>u.id!==id); toast('User deleted'); draw();
}
function submitAttempt(quizId, ans){
  const quiz = S.quizzes.find(q=>q.id===quizId);
  if(!quiz||!S.me) return null;
  let score=0;
  const detail = quiz.questions.map((q,i)=>{
    const ok = ans[i]===q.correct; if(ok)score++;
    return {ok,sel:ans[i],cor:q.correct};
  });
  const pct = Math.round(score/quiz.questions.length*100);
  const att = {id:uid(),userId:S.me.id,quizId,score,total:quiz.questions.length,pct,at:new Date().toISOString(),ans,detail};
  S.attempts.push(att);
  const qi = S.quizzes.findIndex(q=>q.id===quizId);
  if(qi>=0) S.quizzes[qi].attempts = (S.quizzes[qi].attempts||0)+1;
  return att;
}

/* ═══════════════════════════════════════════════════════
   QUIZ TAKING STATE
═══════════════════════════════════════════════════════ */
function initQT(quiz){
  if(S.qt.timer) clearInterval(S.qt.timer);
  S.qt = { cur:0, ans:Array(quiz.questions.length).fill(null), done:false, result:null, secs:quiz.questions.length*60, timer:null };
}
function startTimer(){
  if(S.qt.timer) clearInterval(S.qt.timer);
  S.qt.timer = setInterval(()=>{
    S.qt.secs--;
    const el = document.getElementById('timerEl');
    if(el){
      const m=Math.floor(S.qt.secs/60), s=String(S.qt.secs%60).padStart(2,'0');
      el.textContent=`${m}:${s}`;
      el.style.color=S.qt.secs<60?'var(--rose)':S.qt.secs<180?'var(--amber)':'var(--emerald)';
    }
    if(S.qt.secs<=0){ clearInterval(S.qt.timer); S.qt.timer=null; finishQuiz(); }
  }, 1000);
}
function selectAnswer(j){
  if(S.qt.done) return;
  S.qt.ans[S.qt.cur] = j;
  // update option visuals without full redraw
  document.querySelectorAll('.opt-item').forEach((el,i)=>{
    el.classList.toggle('selected', i===j);
    el.querySelector('.opt-letter').style.cssText = i===j ? 'border-color:var(--indigo);background:var(--indigo);color:#fff' : '';
  });
  // update dot
  document.querySelectorAll('.q-dot').forEach((d,i)=>{
    if(i===S.qt.cur) return;
    d.classList.toggle('done', S.qt.ans[i]!==null);
  });
}
function goQuestion(n){
  S.qt.cur = n;
  redrawQuizQuestion();
}
function redrawQuizQuestion(){
  document.getElementById('app').innerHTML = renderTakeQuiz();
  startTimer();
}
function finishQuiz(){
  if(S.qt.timer){ clearInterval(S.qt.timer); S.qt.timer=null; }
  S.qt.done = true;
  S.qt.result = submitAttempt(S.quizCtx.id, S.qt.ans);
  document.getElementById('app').innerHTML = renderTakeQuiz();
}

/* ═══════════════════════════════════════════════════════
   MAIN DRAW
═══════════════════════════════════════════════════════ */
function draw(){
  const app = document.getElementById('app');
  const { page, me, dark } = S;

  if(['landing','login','register'].includes(page)){
    app.innerHTML = page==='landing'?buildLanding():page==='login'?buildLogin():buildRegister();
    return;
  }
  if(page==='take_quiz'){
    app.innerHTML = renderTakeQuiz();
    if(!S.qt.done) startTimer();
    return;
  }
  if(!me){ app.innerHTML=buildLogin(); return; }

  app.innerHTML = `
    <div id="app">
      ${buildSidebar()}
      <div class="main-wrap">
        ${buildTopbar()}
        <div class="page-body" id="pageBody">
          ${buildPageContent()}
        </div>
      </div>
    </div>`;
}

function buildLogin(){

function doLoginSubmit(){
  const email = document.getElementById('liEmail').value.trim();
  const pw    = document.getElementById('liPw').value;
  const err   = document.getElementById('loginErr');
  err.style.display='none';
  if(!email||!pw){err.style.display='block';err.textContent='Please fill in both fields.';return;}
  const btn   = document.getElementById('liBtn');
  btn.innerHTML='<span class="spin"></span>'; btn.disabled=true;
  setTimeout(()=>{
    const ok = doLogin(email,pw);
    if(!ok){err.style.display='block';err.textContent='Incorrect email or password.';btn.innerHTML='Sign In';btn.disabled=false;}
  },450);
}

function buildRegister(){
  return `<div class="auth-page">
    <div class="auth-box">
      <div class="auth-head">
        <div class="logo">Quiz<em>ify</em></div>
        <p>Create your free account</p>

      </div>

        <div class="err-msg" id="reEmail"></div>
      </div>
      <div class="field"><label>Password</label>
        <input class="inp" type="password" id="ruPw" placeholder="Minimum 6 characters">
        <div class="err-msg" id="rePw"></div>
      </div>
      <div class="field"><label>Confirm password</label>
        <input class="inp" type="password" id="ruPw2" placeholder="Repeat password" onkeydown="if(event.key==='Enter')doRegSubmit()">
        <div class="err-msg" id="rePw2"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:4px" id="regBtn" onclick="doRegSubmit()">Create Account</button>

      </p>

function doRegSubmit(){
  const name  = document.getElementById('ruName').value.trim();
  const email = document.getElementById('ruEmail').value.trim();
  const pw    = document.getElementById('ruPw').value;
  const pw2   = document.getElementById('ruPw2').value;
  ['reUser','reEmail','rePw','rePw2'].forEach(id=>document.getElementById(id).textContent='');
  let ok=true;
  if(name.length<3){document.getElementById('reUser').textContent='At least 3 characters required';ok=false;}
  if(!email.includes('@')){document.getElementById('reEmail').textContent='Enter a valid email';ok=false;}
  if(pw.length<6){document.getElementById('rePw').textContent='Minimum 6 characters';ok=false;}
  if(pw!==pw2){document.getElementById('rePw2').textContent='Passwords do not match';ok=false;}
  if(!ok)return;
  const btn=document.getElementById('regBtn');
  btn.innerHTML='<span class="spin"></span>';btn.disabled=true;
  setTimeout(()=>{
    const res=doRegister(name,email,pw);
    if(!res){document.getElementById('reEmail').textContent='This email is already registered';btn.innerHTML='Create Account';btn.disabled=false;}
  },450);
}

  return `<div>

        <div style="position:relative;flex:1;min-width:200px">
          <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none">${ICO('search',15)}</span>
          <input class="inp" style="padding-left:34px" placeholder="Search quizzes…"
            value="${S.br.q}" oninput="S.br.q=this.value;refreshBrowseGrid()">
        </div>
        <select class="inp" style="width:175px;flex:none" onchange="S.br.cat=this.value;refreshBrowseGrid()">
          <option value="all" ${S.br.cat==='all'?'selected':''}>All Categories</option>
          ${CATS.map(c=>`<option value="${c}" ${S.br.cat===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <select class="inp" style="width:175px;flex:none" onchange="S.br.sort=this.value;refreshBrowseGrid()">
          <option value="newest" ${S.br.sort==='newest'?'selected':''}>Newest first</option>
          <option value="attempts" ${S.br.sort==='attempts'?'selected':''}>Most attempted</option>
          <option value="rating" ${S.br.sort==='rating'?'selected':''}>Highest rated</option>
        </select>
      </div>
    </div>
    <div id="browseGrid">${browseGrid(filtered)}</div>
  </div>`;
}
function browseGrid(list){
  if(!list){
    const pub=S.quizzes.filter(q=>q.status==='published');
    list=pub.filter(q=>(S.br.cat==='all'||q.category===S.br.cat)&&(q.title.toLowerCase().includes(S.br.q.toLowerCase())||q.description.toLowerCase().includes(S.br.q.toLowerCase()))).sort((a,b)=>S.br.sort==='newest'?new Date(b.createdAt)-new Date(a.createdAt):S.br.sort==='attempts'?(b.attempts||0)-(a.attempts||0):(b.rating||0)-(a.rating||0));
  }
  if(list.length===0)return`<div class="empty"><div class="empty-ico">🔍</div><h3>No quizzes found</h3><p>Try adjusting the search or category filter.</p></div>`;
  return`<div class="quiz-grid">${list.map(q=>qCard(q,`pickQuiz('${q.id}')`)).join('')}</div>`;
}
function refreshBrowseGrid(){ const g=document.getElementById('browseGrid'); if(g)g.innerHTML=browseGrid(); }
function pickQuiz(id){ const q=S.quizzes.find(x=>x.id===id); if(!q)return; if(!S.me){go('login');return;} go('take_quiz',q); }

/* ═══════════════════════════════════════════════════════
   MY QUIZZES
═══════════════════════════════════════════════════════ */
function buildMyQuizzes(){

    <div class="page-hdr">
      <div class="page-hdr-l"><h1>My Quizzes</h1><p>${myQ.length} quiz${myQ.length!==1?'zes':''}</p></div>

    </div>
    ${myQ.length===0
      ?`<div class="empty"><div class="empty-ico">📚</div><h3>No quizzes yet</h3><p>Create your first quiz and share it with the world.</p><br><button class="btn btn-primary" onclick="go('create_quiz')">Create a quiz</button></div>`
      :`<div class="card"><div class="tbl-wrap"><table>
        <thead><tr><th>Title</th><th>Category</th><th>Questions</th><th>Attempts</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody>${myQ.map(q=>`<tr>
          <td><div style="font-weight:500">${q.title}</div><div style="font-size:11.5px;color:var(--text2);margin-top:2px">${q.description.slice(0,52)}…</div></td>
          <td><span class="badge badge-indigo">${q.category}</span></td>
          <td>${q.questions.length}</td>
          <td>${q.attempts||0}</td>
          <td><span class="badge ${q.status==='published'?'badge-green':'badge-amber'}">${q.status}</span></td>
          <td style="color:var(--text2)">${ago(q.createdAt)}</td>
          <td><div style="display:flex;gap:6px">
            <button class="btn btn-text btn-icon btn-sm" title="Edit" onclick="go('edit_quiz',S.quizzes.find(x=>x.id==='${q.id}'))">${ICO('edit',15)}</button>
            <button class="btn btn-text btn-icon btn-sm" title="Preview" onclick="pickQuiz('${q.id}')">${ICO('eye',15)}</button>
            <button class="btn btn-danger btn-icon btn-sm" title="Delete" onclick="if(confirm('Delete this quiz?'))delQuiz('${q.id}')">${ICO('trash',15)}</button>
          </div></td>
        </tr>`).join('')}</tbody>
      </table></div></div>`}

}

/* ═══════════════════════════════════════════════════════
   CREATE / EDIT QUIZ
═══════════════════════════════════════════════════════ */
function getCQ(){
  if(S.cq) return S.cq;
  if(S.page==='edit_quiz' && S.editCtx){
    S.cq = JSON.parse(JSON.stringify(S.editCtx));
    return S.cq;
  }
  S.cq = {id:null,title:'',description:'',category:'',questions:[{id:uid(),text:'',options:['','','',''],correct:0,expl:''}]};
  return S.cq;
}
function buildCreateQuiz(existing){
  const cq = getCQ();
  return `<div style="max-width:820px;margin:0 auto">
    <div class="page-hdr">
      <div class="page-hdr-l"><h1>${existing?'Edit Quiz':'Create New Quiz'}</h1></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" onclick="handleSaveCQ('draft')">Save Draft</button>
        <button class="btn btn-primary" onclick="handleSaveCQ('published')">${ICO('flag',15)} Publish</button>
      </div>
    </div>

    <div class="card gap-bottom">
      <h2 style="font-size:14.5px;font-weight:600;margin-bottom:16px">Quiz Details</h2>
      <div class="field"><label>Title *</label>
        <input class="inp" id="cqTitle" value="${cq.title}" placeholder="e.g. JavaScript Fundamentals Quiz">
        <div class="err-msg" id="cqETitle"></div>
      </div>
      <div class="field"><label>Description</label>
        <textarea class="inp" id="cqDesc" placeholder="What does this quiz cover?">${cq.description}</textarea>
      </div>
      <div class="field" style="margin-bottom:0"><label>Category *</label>
        <select class="inp" id="cqCat" onchange="getCQ().category=this.value">
          <option value="">Select a category…</option>
          ${CATS.map(c=>`<option value="${c}" ${cq.category===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <div class="err-msg" id="cqECat"></div>
      </div>
    </div>

    <div id="cqQList">${cq.questions.map((q,i)=>buildQEditor(q,i)).join('')}</div>

    <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:22px" onclick="addCQQ()">
      ${ICO('plus',15)} Add Question
    </button>
  </div>`;
}
function buildQEditor(q,i){
  const labs=['A','B','C','D'];
  return `<div class="qeditor" id="qed${i}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="qeditor-num">Question ${i+1}</div>
      <button class="btn btn-danger btn-sm" onclick="removeCQQ(${i})">${ICO('trash',13)} Remove</button>
    </div>
    <div class="field">
      <label>Question *</label>
      <textarea class="inp" style="min-height:58px" placeholder="Enter your question…"
        oninput="getCQ().questions[${i}].text=this.value">${q.text}</textarea>
      <div class="err-msg" id="cqEQ${i}"></div>
    </div>
    <div class="opts-grid">
      ${q.options.map((opt,j)=>`<div class="opt-input-row">
        <input type="radio" name="cor${i}" ${q.correct===j?'checked':''}
          onchange="getCQ().questions[${i}].correct=${j}" title="Mark as correct answer">
        <input class="inp" style="flex:1" value="${opt}" placeholder="Option ${labs[j]}"
          oninput="getCQ().questions[${i}].options[${j}]=this.value">
      </div>`).join('')}
    </div>
    <div style="font-size:11.5px;color:var(--text2);margin-bottom:10px">
      Select the radio button next to the correct answer. Currently: <strong>Option ${labs[q.correct]}</strong>
    </div>
    <div class="field" style="margin-bottom:0">
      <label>Explanation (optional)</label>
      <input class="inp" value="${q.expl||''}" placeholder="Why is this answer correct?"
        oninput="getCQ().questions[${i}].expl=this.value">
    </div>
  </div>`;
}
function addCQQ(){
  const cq=getCQ(); cq.questions.push({id:uid(),text:'',options:['','','',''],correct:0,expl:''});
  document.getElementById('cqQList').innerHTML=cq.questions.map((q,i)=>buildQEditor(q,i)).join('');
}
function removeCQQ(i){
  const cq=getCQ();
  if(cq.questions.length<=1){toast('Need at least one question','wa');return;}
  cq.questions.splice(i,1);
  document.getElementById('cqQList').innerHTML=cq.questions.map((q,i)=>buildQEditor(q,i)).join('');
}
function handleSaveCQ(status){
  const cq=getCQ();
  cq.title  = document.getElementById('cqTitle').value.trim();
  cq.description = document.getElementById('cqDesc').value.trim();
  cq.category = document.getElementById('cqCat').value;
  document.getElementById('cqETitle').textContent='';
  document.getElementById('cqECat').textContent='';
  let ok=true;
  if(!cq.title){document.getElementById('cqETitle').textContent='Title is required';ok=false;}
  if(!cq.category){document.getElementById('cqECat').textContent='Select a category';ok=false;}
  cq.questions.forEach((q,i)=>{
    const el=document.getElementById(`cqEQ${i}`); if(el)el.textContent='';
    if(!q.text.trim()){if(el)el.textContent='Question text is required';ok=false;}
    else if(q.options.some(o=>!o.trim())){if(el)el.textContent='Fill in all 4 options';ok=false;}
  });
  if(!ok){toast('Fix the highlighted errors','wa');return;}
  cq.status=status; cq.creatorId=S.me.id;
  saveQuiz({...cq});
  toast(status==='published'?'Quiz published!':'Draft saved');
  S.cq=null;
  go('my_quizzes');
}

/* ═══════════════════════════════════════════════════════
   TAKE QUIZ
═══════════════════════════════════════════════════════ */
function renderTakeQuiz(){
  const quiz = S.quizCtx;
  if(!quiz) return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
    <div style="text-align:center"><h2>No quiz selected</h2><br>
      <button class="btn btn-primary" onclick="go('browse')">Browse Quizzes</button></div></div>`;

  if(S.qt.done && S.qt.result) return renderResult(quiz, S.qt.result);

  const q    = quiz.questions[S.qt.cur];
  const labs = ['A','B','C','D'];
  const pct  = Math.round((S.qt.cur+1)/quiz.questions.length*100);
  const secs = S.qt.secs;
  const m=Math.floor(secs/60), s=String(secs%60).padStart(2,'0');
  const tcol = secs<60?'var(--rose)':secs<180?'var(--amber)':'var(--emerald)';

  return `<div class="quiz-page">
    <style>body{font-family:'Inter',system-ui,sans-serif}</style>
    <div style="max-width:700px;margin:0 auto">
      <button class="btn btn-text" style="margin-bottom:16px" onclick="go('browse')">${ICO('arrowL',16)} Back to Browse</button>

      <div class="card gap-bottom">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-size:17px;font-weight:700">${quiz.title}</div>
            <div style="font-size:12.5px;color:var(--text2);margin-top:3px">${quiz.questions.length} questions · ${quiz.category}</div>
          </div>
          <div class="timer-display" id="timerEl" style="color:${tcol}">${m}:${s}</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text2);margin-bottom:7px">
          <span>Question ${S.qt.cur+1} of ${quiz.questions.length}</span>
          <span>${S.qt.ans.filter(a=>a!==null).length} answered</span>
        </div>
        <div class="qprog-bar"><div class="qprog-fill" style="width:${pct}%"></div></div>
      </div>

      <div class="card gap-bottom">
        <div style="font-size:16.5px;font-weight:600;line-height:1.55;margin-bottom:20px">${S.qt.cur+1}. ${q.text}</div>
        ${q.options.map((opt,j)=>`<div class="opt-item ${S.qt.ans[S.qt.cur]===j?'selected':''}" onclick="selectAnswer(${j})">
          <div class="opt-letter" style="${S.qt.ans[S.qt.cur]===j?'border-color:var(--indigo);background:var(--indigo);color:#fff':''}">${labs[j]}</div>
          <span style="font-size:14px">${opt}</span>
        </div>`).join('')}
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <button class="btn btn-ghost" ${S.qt.cur===0?'disabled':''} onclick="goQuestion(${S.qt.cur-1})">${ICO('arrowL',15)} Previous</button>
        <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1;padding:0 8px">
          ${quiz.questions.map((_,i)=>`<button class="q-dot ${i===S.qt.cur?'cur':S.qt.ans[i]!==null?'done':''}" onclick="goQuestion(${i})">${i+1}</button>`).join('')}
        </div>
        ${S.qt.cur < quiz.questions.length-1
          ?`<button class="btn btn-primary" onclick="goQuestion(${S.qt.cur+1})">Next ${ICO('arrowR',15)}</button>`
          :`<button class="btn btn-success" onclick="finishQuiz()">${ICO('flag',15)} Submit Quiz</button>`}
      </div>

      ${S.qt.ans.some(a=>a===null) && S.qt.cur===quiz.questions.length-1
        ?`<div class="warn-box" style="margin-top:14px">${ICO('info',14)} ${S.qt.ans.filter(a=>a===null).length} question(s) still unanswered — go back or submit anyway.</div>`
        :''}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   QUIZ RESULT
═══════════════════════════════════════════════════════ */
function renderResult(quiz, result){
  const labs=['A','B','C','D'];
  const pass = result.pct>=60;
  return `<div class="quiz-page">
    <style>body{font-family:'Inter',system-ui,sans-serif}</style>
    <div style="max-width:700px;margin:0 auto">

      <div class="card gap-bottom" style="text-align:center">
        <div style="font-size:13px;color:var(--text2);margin-bottom:18px">Quiz Complete — ${quiz.title}</div>
        <div class="score-ring ${pass?'pass':'fail'}">
          <div class="val">${result.pct}%</div>
          <div class="of">${result.score}/${result.total}</div>
        </div>
        <div style="font-size:22px;font-weight:700;margin-bottom:10px">
          ${result.pct>=80?'🎉 Excellent!':result.pct>=60?'👍 Good job!':'📚 Keep practising!'}
        </div>
        <span class="badge ${pass?'badge-green':'badge-rose'}" style="font-size:13px;padding:5px 16px">${pass?'PASSED':'FAILED'}</span>

        <div class="g3" style="margin-top:22px">
          <div class="card-sm" style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--emerald)">${result.score}</div><div style="font-size:12px;color:var(--text2)">Correct</div></div>
          <div class="card-sm" style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--rose)">${result.total-result.score}</div><div style="font-size:12px;color:var(--text2)">Wrong</div></div>
          <div class="card-sm" style="text-align:center"><div style="font-size:22px;font-weight:700">${result.total}</div><div style="font-size:12px;color:var(--text2)">Total</div></div>
        </div>

        <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="showReview()">${ICO('eye',15)} Review Answers</button>
          <button class="btn btn-ghost" onclick="go('browse')">More Quizzes</button>
          <button class="btn btn-ghost" onclick="go('dashboard')">Dashboard</button>
        </div>
      </div>

      <div id="reviewArea"></div>
    </div>
  </div>`;
}
function showReview(){
  const quiz=S.quizCtx, result=S.qt.result;
  const labs=['A','B','C','D'];
  document.getElementById('reviewArea').innerHTML = `
    <h2 style="font-size:15px;font-weight:600;margin-bottom:14px">Answer Review</h2>
    ${quiz.questions.map((q,i)=>{
      const d=result.detail[i]||{};
      const cor = d.cor!==undefined?d.cor:q.correct;
      const sel = d.sel!==undefined?d.sel:result.ans[i];
      return `<div class="card gap-bottom">
        <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:14px">
          <div style="width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${d.ok?'var(--emerald)':'var(--rose)'}">
            ${d.ok?ICO('check',12,'color:#fff;stroke:#fff'):ICO('x',12,'color:#fff;stroke:#fff')}
          </div>
          <div style="font-weight:500;font-size:14.5px;line-height:1.5">Q${i+1}. ${q.text}</div>
        </div>
        ${q.options.map((opt,j)=>`<div class="opt-item ${j===cor?'correct':j===sel&&!d.ok?'wrong':''}" style="cursor:default">
          <div class="opt-letter ${j===cor?'correct':j===sel&&!d.ok?'wrong':''}">${labs[j]}</div>
          <span style="flex:1;font-size:13.5px">${opt}</span>
          ${j===cor?`<span class="badge badge-green">Correct</span>`:''}
          ${j===sel&&!d.ok?`<span class="badge badge-rose">Your answer</span>`:''}
        </div>`).join('')}
        ${q.expl?`<div class="expl-box"><strong style="color:var(--indigo)">Explanation:</strong> ${q.expl}</div>`:''}
      </div>`;
    }).join('')}`;
}

/* ═══════════════════════════════════════════════════════
   LEADERBOARD
═══════════════════════════════════════════════════════ */
function buildLeaderboard(){
  const perfs = getPerfs();
  const topQ  = [...S.quizzes].filter(q=>q.status==='published').sort((a,b)=>(b.attempts||0)-(a.attempts||0)).slice(0,10);
  const medals=['🥇','🥈','🥉'], mcol=['#f59e0b','#94a3b8','#d97706'];

  return `<div>
    <div class="page-hdr"><div class="page-hdr-l"><h1>Leaderboard</h1></div></div>
    <div class="tabs">
      <button class="tab-btn ${S.tabs.lb==='perf'?'active':''}" onclick="S.tabs.lb='perf';refreshLB()">Top Performers</button>
      <button class="tab-btn ${S.tabs.lb==='quiz'?'active':''}" onclick="S.tabs.lb='quiz';refreshLB()">Popular Quizzes</button>
    </div>
    <div id="lbBody">${renderLBBody(perfs,topQ,medals,mcol)}</div>
  </div>`;
}
function getPerfs(){
  return S.users.filter(u=>u.role!=='admin').map(u=>{
    const ua=S.attempts.filter(a=>a.userId===u.id);
    return{...u,avg:ua.length?Math.round(ua.reduce((n,a)=>n+a.pct,0)/ua.length):0,taken:ua.length,best:ua.length?Math.max(...ua.map(a=>a.pct)):0};
  }).filter(u=>u.taken>0).sort((a,b)=>b.avg-a.avg);
}
function renderLBBody(perfs,topQ,medals,mcol){
  if(S.tabs.lb==='perf'){
    const podium=perfs.length>=3?`<div class="podium">
      ${[perfs[1],perfs[0],perfs[2]].map((u,i)=>{const rank=[2,1,3][i];const h=[75,108,65][i];const col=mcol[rank-1];return`<div class="podium-col">
        <div style="font-size:26px;margin-bottom:8px">${medals[rank-1]}</div>
        <div class="av podium-av">${u.av}</div>
        <div class="podium-name">${u.username}</div>
        <div class="podium-score" style="color:${col}">${u.avg}%</div>
        <div class="podium-base" style="height:${h}px;background:${col}18;border-color:${col}"></div>
      </div>`;}).join('')}
    </div>`:'';
    if(!perfs.length)return`<div class="card"><div class="empty"><div class="empty-ico">🏆</div><h3>No data yet</h3><p>Take some quizzes to appear here.</p></div></div>`;
    return podium+`<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Rank</th><th>User</th><th>Avg Score</th><th>Quizzes Taken</th><th>Best</th></tr></thead>
      <tbody>${perfs.map((u,i)=>`<tr>
        <td><div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${i<3?mcol[i]+'22':'var(--surface2)'};color:${i<3?mcol[i]:'var(--text2)'};font-size:11.5px;font-weight:700">${i<3?medals[i]:'#'+(i+1)}</div></td>
        <td><div style="display:flex;align-items:center;gap:10px"><div class="av">${u.av}</div><div><div style="font-weight:500">${u.username}</div><div style="font-size:11.5px;color:var(--text2)">${u.email}</div></div></div></td>
        <td><div style="display:flex;align-items:center;gap:9px"><div class="pbar" style="width:80px"><div class="pbar-fill" style="width:${u.avg}%;background:${u.avg>=80?'var(--emerald)':u.avg>=60?'var(--amber)':'var(--rose)'}"></div></div><span style="font-weight:600">${u.avg}%</span></div></td>
        <td>${u.taken}</td>
        <td style="font-weight:600;color:var(--emerald)">${u.best}%</td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
  } else {
    return`<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Rank</th><th>Quiz</th><th>Category</th><th>Attempts</th><th>Rating</th></tr></thead>
      <tbody>${topQ.map((q,i)=>`<tr>
        <td><div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${i<3?mcol[i]+'22':'var(--surface2)'};color:${i<3?mcol[i]:'var(--text2)'};font-size:11.5px;font-weight:700">${i<3?medals[i]:'#'+(i+1)}</div></td>
        <td><div style="font-weight:500">${q.title}</div><div style="font-size:11.5px;color:var(--text2)">${q.questions.length} questions</div></td>
        <td><span class="badge badge-indigo">${q.category}</span></td>
        <td style="font-weight:600">${q.attempts||0}</td>
        <td>${q.rating>0?`<span style="color:var(--amber)">★ ${q.rating.toFixed(1)}</span>`:'—'}</td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
  }
}
function refreshLB(){
  const el=document.getElementById('lbBody'); if(!el)return;
  const perfs=getPerfs();
  const topQ=[...S.quizzes].filter(q=>q.status==='published').sort((a,b)=>(b.attempts||0)-(a.attempts||0)).slice(0,10);
  el.innerHTML=renderLBBody(perfs,topQ,['🥇','🥈','🥉'],['#f59e0b','#94a3b8','#d97706']);
}

/* ═══════════════════════════════════════════════════════
   PROFILE
═══════════════════════════════════════════════════════ */
function buildProfile(){
  const { me, quizzes, attempts } = S;
  const myA = attempts.filter(a=>a.userId===me.id);
  const myQ = quizzes.filter(q=>q.creatorId===me.id);
  const avg  = myA.length?Math.round(myA.reduce((n,a)=>n+a.pct,0)/myA.length):0;
  const best = myA.length?Math.max(...myA.map(a=>a.pct)):0;

  return `<div style="max-width:820px;margin:0 auto">
    <div class="card gap-bottom">
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
        <div class="av av-lg">${me.av}</div>
        <div>
          <div style="font-size:21px;font-weight:700">${me.username}</div>
          <div style="font-size:13.5px;color:var(--text2);margin-top:3px">${me.email}</div>
          <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
            <span class="badge ${me.role==='admin'?'badge-rose':'badge-indigo'}">${me.role}</span>
            <span style="font-size:12px;color:var(--text3)">Joined ${ago(me.createdAt)}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="stat-row gap-bottom">
      ${[
        {icon:'book',  bg:'#e0e7ff',c:'#6366f1',lbl:'Quizzes Created',val:myQ.length},
        {icon:'pulse', bg:'#d1fae5',c:'#059669',lbl:'Quizzes Taken',  val:myA.length},
        {icon:'bar',   bg:'#fef3c7',c:'#d97706',lbl:'Average Score',  val:avg+'%'},
        {icon:'trophy',bg:'#dbeafe',c:'#2563eb',lbl:'Best Score',     val:best+'%'},
      ].map(s=>`<div class="stat-card">
        <div class="stat-icon" style="background:${s.bg};color:${s.c}">${ICO(s.icon,19)}</div>
        <div class="stat-val">${s.val}</div><div class="stat-lbl">${s.lbl}</div>
      </div>`).join('')}
    </div>

    <div class="card">
      <div class="sec-hdr"><h2>Quiz History</h2></div>
      ${myA.length===0
        ?`<div class="empty" style="padding:28px 0"><div class="empty-ico">📋</div><p>No attempts yet. <a href="#" onclick="go('browse')" style="color:var(--indigo)">Browse quizzes →</a></p></div>`
        :[...myA].sort((a,b)=>new Date(b.at)-new Date(a.at)).map(a=>{
          const q=quizzes.find(x=>x.id===a.quizId); if(!q)return'';
          return`<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)">
            <div style="flex:1;min-width:0">
              <div style="font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${q.title}</div>
              <div style="font-size:11.5px;color:var(--text2);margin-top:2px">${ago(a.at)} · ${q.category}</div>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-right:10px">
              <div style="font-size:15px;font-weight:700;color:${a.pct>=60?'var(--emerald)':'var(--rose)'}">${a.pct}%</div>
              <div style="font-size:11px;color:var(--text3)">${a.score}/${a.total} correct</div>
            </div>
            <div style="width:64px;flex-shrink:0"><div class="pbar"><div class="pbar-fill" style="width:${a.pct}%;background:${a.pct>=60?'var(--emerald)':'var(--rose)'}"></div></div></div>
          </div>`;}).join('')}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   ADMIN
═══════════════════════════════════════════════════════ */
function buildAdmin(){
  return `<div>
    <div class="page-hdr">
      <div class="page-hdr-l"><h1>Admin Panel</h1><p>Platform management &amp; statistics</p></div>
      <span class="badge badge-rose" style="padding:5px 14px;font-size:12.5px">🛡 Admin</span>
    </div>
    <div class="tabs">
      ${['overview','users','quizzes','activity'].map(t=>`<button class="tab-btn ${S.tabs.adm===t?'active':''}" onclick="S.tabs.adm='${t}';refreshAdm()" style="text-transform:capitalize">${t}</button>`).join('')}
    </div>
    <div id="admBody">${renderAdmTab()}</div>
  </div>`;
}
function renderAdmTab(){
  const { users, quizzes, attempts } = S;
  const avg = attempts.length?Math.round(attempts.reduce((n,a)=>n+a.pct,0)/attempts.length):0;

  if(S.tabs.adm==='overview'){
    return`<div>
      <div class="stat-row gap-bottom">
        ${[
          {icon:'users', bg:'#e0e7ff',c:'#6366f1',lbl:'Total Users',    val:users.length},
          {icon:'book',  bg:'#d1fae5',c:'#059669',lbl:'Total Quizzes',  val:quizzes.length},
          {icon:'pulse', bg:'#fef3c7',c:'#d97706',lbl:'Total Attempts', val:attempts.length},
          {icon:'bar',   bg:'#dbeafe',c:'#2563eb',lbl:'Avg Score',      val:avg+'%'},
          {icon:'flag',  bg:'#ede9fe',c:'#7c3aed',lbl:'Published',      val:quizzes.filter(q=>q.status==='published').length},
          {icon:'user',  bg:'#fce7f3',c:'#be185d',lbl:'Active Users',   val:users.filter(u=>attempts.some(a=>a.userId===u.id)).length},
        ].map(s=>`<div class="stat-card"><div class="stat-icon" style="background:${s.bg};color:${s.c}">${ICO(s.icon,19)}</div><div class="stat-val">${s.val}</div><div class="stat-lbl">${s.lbl}</div></div>`).join('')}
      </div>
      <div class="g2">
        <div class="card">
          <div class="sec-hdr"><h2>Category Breakdown</h2></div>
          ${CATS.map(cat=>{const n=quizzes.filter(q=>q.category===cat).length;if(!n)return'';const pct=Math.round(n/quizzes.length*100);return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><span style="font-size:12.5px;width:138px;flex-shrink:0">${cat}</span><div class="pbar" style="flex:1"><div class="pbar-fill" style="width:${pct}%"></div></div><span style="font-size:12.5px;font-weight:600;width:18px">${n}</span></div>`;}).join('')}
        </div>
        <div class="card">
          <div class="sec-hdr"><h2>Recent Activity</h2></div>
          ${[...attempts].sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,6).map(a=>{
            const u=users.find(x=>x.id===a.userId), q=quizzes.find(x=>x.id===a.quizId); if(!u||!q)return'';
            return`<div style="display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)">
              <div class="av" style="width:30px;height:30px;font-size:11px">${u.av}</div>
              <div style="flex:1;min-width:0"><div style="font-size:12.5px"><strong>${u.username}</strong> took <em>${q.title}</em></div><div style="font-size:11px;color:var(--text3)">${ago(a.at)}</div></div>
              <span style="font-weight:700;font-size:13px;color:${a.pct>=60?'var(--emerald)':'var(--rose)'}">${a.pct}%</span>
            </div>`;}).join('')}
        </div>
      </div>
    </div>`;
  }
  if(S.tabs.adm==='users'){
    return`<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Quizzes</th><th>Attempts</th><th>Joined</th><th>Action</th></tr></thead>
      <tbody>${users.map(u=>`<tr>
        <td><div style="display:flex;align-items:center;gap:9px"><div class="av" style="width:30px;height:30px;font-size:11px">${u.av}</div><span style="font-weight:500">${u.username}</span></div></td>
        <td style="color:var(--text2)">${u.email}</td>
        <td><span class="badge ${u.role==='admin'?'badge-rose':'badge-gray'}">${u.role}</span></td>
        <td>${quizzes.filter(q=>q.creatorId===u.id).length}</td>
        <td>${attempts.filter(a=>a.userId===u.id).length}</td>
        <td style="color:var(--text2);font-size:12px">${ago(u.createdAt)}</td>
        <td><button class="btn btn-danger btn-sm" onclick="if(confirm('Delete ${u.username}?'))delUser('${u.id}')">${ICO('trash',13)} Delete</button></td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
  }
  if(S.tabs.adm==='quizzes'){
    return`<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Quiz</th><th>Creator</th><th>Category</th><th>Qs</th><th>Attempts</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>${quizzes.map(q=>{const cr=users.find(u=>u.id===q.creatorId);return`<tr>
        <td><div style="font-weight:500">${q.title}</div></td>
        <td style="color:var(--text2)">${cr?.username||'—'}</td>
        <td><span class="badge badge-indigo">${q.category}</span></td>
        <td>${q.questions.length}</td><td>${q.attempts||0}</td>
        <td><span class="badge ${q.status==='published'?'badge-green':'badge-amber'}">${q.status}</span></td>
        <td><button class="btn btn-danger btn-sm" onclick="if(confirm('Delete quiz?'))delQuiz('${q.id}')">${ICO('trash',13)} Delete</button></td>
      </tr>`;}).join('')}</tbody>
    </table></div></div>`;
  }
  if(S.tabs.adm==='activity'){
    return`<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>User</th><th>Quiz</th><th>Score</th><th>Date</th></tr></thead>
      <tbody>${[...attempts].sort((a,b)=>new Date(b.at)-new Date(a.at)).map(a=>{
        const u=users.find(x=>x.id===a.userId), q=quizzes.find(x=>x.id===a.quizId);
        return`<tr>
          <td><div style="display:flex;align-items:center;gap:8px"><div class="av" style="width:28px;height:28px;font-size:10px">${u?.av||'??'}</div>${u?.username||'Deleted'}</div></td>
          <td style="color:var(--text2)">${q?.title||'Deleted quiz'}</td>
          <td><span style="font-weight:700;color:${a.pct>=60?'var(--emerald)':'var(--rose)'}">${a.pct}% (${a.score}/${a.total})</span></td>
          <td style="font-size:12px;color:var(--text2)">${new Date(a.at).toLocaleString()}</td>
        </tr>`;}).join('')}</tbody>
    </table></div></div>`;
  }
  return '';
}
function refreshAdm(){ const el=document.getElementById('admBody'); if(el)el.innerHTML=renderAdmTab(); }

/* ═══════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════ */
draw();
</script>
</body>
</html>
